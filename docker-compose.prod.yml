# Éles környezet a Dokployon. A Dokploy "Compose" alkalmazásként futtatja,
# a "Compose Path" mezőbe ennek a fájlnak a neve kerül.
# Ami itt NINCS, az egy másik gépen már fut: az n8n és a RustFS objektumtároló.
# A ${...} értékeket a Dokploy "Environment" lapján kell megadni: a repóba se jelszó, se belső cím nem kerül.
#   POSTGRES_PASSWORD  az adatbázis jelszava
#   LAN_BIND_IP        ennek a gépnek a belső hálózati címe; az adatbázis és a PDF-készítő csak erre köt
#   N8N_BASE_URL       az n8n címe a belső hálózaton, pl. http://<n8n gépe>:5678
#   S3_ENDPOINT        az objektumtároló S3 API-jának címe, pl. http://<tároló gépe>:9000
#   S3_ACCESS_KEY, S3_SECRET_KEY  a tároló kulcspárja
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ajanlat
      POSTGRES_USER: ajanlat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?add meg a Dokploy Environment lapján}
    ports:
      # Az n8n egy másik gépről éri el, ezért kell kivezetni. Csak a belső hálózati címre köt,
      # és az 5433-as portra, mert az 5432-t ezen a gépen egy másik alkalmazás adatbázisa használja.
      - "${LAN_BIND_IP:?add meg a Dokploy Environment lapján}:5433:5432"
    volumes:
      # Csak az első indításkor fut le, amikor az adatmappa még üres: név szerinti sorrendben betölti a .sql fájlokat.
      - ./db:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajanlat -d ajanlat"]
      interval: 5s
      retries: 20

  pdf:
    build: ./pdf-service
    restart: unless-stopped
    ports:
      # Az n8n hívja a másik gépről: a Jóváhagyás workflow pdf_url beállítása http://<LAN_BIND_IP>:8300/render lesz.
      - "${LAN_BIND_IP}:8300:8000"

  # A demóoldal. Portot nem vezet ki: a nyilvános címet a Dokploy "Domains" lapján kell megadni (3000-es port),
  # a Traefik-címkéket a Dokploy teszi rá. Kézi címke ne kerüljön ide, mert ütközik a Dokploy sajátjával.
  web:
    build: ./web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ajanlat:${POSTGRES_PASSWORD}@db:5432/ajanlat
      N8N_BASE_URL: ${N8N_BASE_URL:?add meg a Dokploy Environment lapján}
      S3_ENDPOINT: ${S3_ENDPOINT:?add meg a Dokploy Environment lapján}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?add meg a Dokploy Environment lapján}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?add meg a Dokploy Environment lapján}
      S3_BUCKET: ajanlat-demo
      DAILY_REQUEST_LIMIT: "50" # ennyi új kérés mehet naponta; a nyelvi modell költségét védi
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
