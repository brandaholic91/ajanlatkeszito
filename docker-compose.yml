# Helyi fejlesztői környezet. Indítás: docker compose up -d
# A portok szándékosan nem a megszokottak, hogy ne ütközzenek más projekttel.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ajanlat
      POSTGRES_USER: ajanlat
      POSTGRES_PASSWORD: ajanlat-dev # csak helyi fejlesztéshez; élesben a Dokploy ad jelszót
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      # az első indításkor a Postgres név szerinti sorrendben lefuttatja az itt lévő .sql fájlokat
      - ./db:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajanlat -d ajanlat"]
      interval: 3s
      retries: 20

  pdf:
    build: ./pdf-service
    ports:
      - "127.0.0.1:8300:8000"

  n8n:
    image: n8nio/n8n:2.41.6 # ugyanaz a verzió, mint a martech-lab gépen
    environment:
      GENERIC_TIMEZONE: Europe/Budapest
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:5679:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
      - ./tests:/tests:ro
    depends_on:
      db:
        condition: service_healthy

  # Objektumtároló a kiküldött PDF-eknek (S3-kompatibilis). Ugyanaz a verzió, mint a martech-lab gépen.
  rustfs:
    image: rustfs/rustfs:1.0.0
    user: "0:0" # helyben rootként fut, hogy ne kelljen külön lépésben átállítani az adatmappa tulajdonosát
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ajanlat-dev # csak helyi fejlesztéshez
      RUSTFS_SECRET_KEY: ajanlat-dev-secret
    ports:
      - "127.0.0.1:9100:9000"
    volumes:
      - rustfs-data:/data

  # Egyszer lefut, létrehozza a bucketet, és kilép. A curl maga írja alá a kérést (--aws-sigv4), nem kell hozzá S3-kliens.
  rustfs-init:
    image: curlimages/curl:8.11.1
    depends_on:
      - rustfs
    environment:
      S3: --aws-sigv4 aws:amz:us-east-1:s3 --user ajanlat-dev:ajanlat-dev-secret
    entrypoint:
      - sh
      - -c
      - |
        until curl -sf -o /dev/null $$S3 -I http://rustfs:9000/ajanlat-demo \
           || curl -sf -o /dev/null $$S3 -X PUT http://rustfs:9000/ajanlat-demo; do sleep 1; done
        echo "bucket kész"

  # Ál-modell, csak teszthez: docker compose --profile test up -d
  fake-llm:
    image: python:3.13-alpine
    profiles: ["test"]
    command: python /fake_llm.py
    ports:
      - "127.0.0.1:8399:8399" # a tesztek innen kérdezik le, mit kapott az ál-levélküldő
    volumes:
      - ./tests/fake_llm.py:/fake_llm.py:ro

volumes:
  db-data:
  n8n-data:
  rustfs-data:
